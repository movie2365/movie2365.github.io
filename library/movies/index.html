<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Movies - Movie2365</title>

  <link rel="stylesheet" href="/styles.css">

</head>


<body>


<!-- =========================
     NAVBAR
     ========================= -->

<header>

  <a
    class="brand"
    href="https://brady2365.github.io"
  >

    <img
      src="/assets/movie2365-logo.png"
      alt="Movie2365 logo"
      style="width:30px !important; height:30px !important; object-fit:contain; flex:0 0 30px;"
    >

    <span>
      Movie2365
    </span>

  </a>


  <nav>

    <a href="https://brady2365.github.io">
      ⌂ Home
    </a>

    <a
      class="active"
      href="/search"
    >
      ▦ Browse
    </a>

    <a href="/search">
      ⊠ Random
    </a>

    <a
      class="search-icon"
      href="/search"
      aria-label="Search"
    >
      ⌕
    </a>

  </nav>

</header>



<!-- =========================
     LIBRARY
     ========================= -->

<main class="library-page">


  <div class="library-header">

    <h1>
      Movies
    </h1>

    <p>
      Browse all movies
    </p>

  </div>



  <!-- =========================
       MOVIES / TV SWITCH
       ========================= -->

  <div class="library-switch">

    <a
      class="library-switch-button active"
      href="/library/movies/index.html"
    >
      🎬 Movies
    </a>


    <a
      class="library-switch-button"
      href="/library/tv-shows/index.html"
    >
      📺 TV Shows
    </a>

  </div>



  <!-- =========================
       MOVIE GRID
       ========================= -->

  <div
    id="movie-library"
    class="results-grid"
  ></div>


</main>



<script src="/app.js"></script>


<script>

const library = document.querySelector(
  "#movie-library"
);


if(library && typeof movies !== "undefined"){

  library.innerHTML = movies
    .map(movie => movieCard(movie))
    .join("");

}

</script>


</body>

</html>
