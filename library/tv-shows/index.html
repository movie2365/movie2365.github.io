<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TV Shows - Movie2365</title>

  <link rel="stylesheet" href="/styles.css">

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header class="site-header">

    <a class="brand" href="https://movie2365.github.io">

      <img
        src="/assets/movie2365-logo.png"
        alt="Movie2365 logo"
        style="width: 30px !important; height: 36px !important; object-fit: contain; flex: 0 0 36px;"
      >

      <span>Movie2365</span>

    </a>


    <nav>

      <a
        class="active"
        href="https://movie2365.github.io"
      >
        ⌂ Home
      </a>


      <a href="/search">
        ▦ Browse
      </a>


      <a href="search.html?random=1">
        ⊠ Random
      </a>


      <a
        class="search-icon"
        href="/search"
        aria-label="Search"
      >
        ⌕
      </a>

    </nav>

  </header>



  <!-- =========================
       TV SHOW LIBRARY
       ========================= -->

  <main class="library-page">


    <!-- HERO -->

    <section class="hero">

      <p class="library-subtitle">
        Browse all TV shows
      </p>

    </section>



    <!-- =========================
         MOVIES / TV SWITCH
         ========================= -->

    <div class="library-switch">

      <a
        class="library-switch-button"
        href="/library/movies"
      >
        🎬 Movies
      </a>


      <a
        class="library-switch-button active"
        href="/library/tv-shows"
      >
        📺 TV Shows
      </a>

    </div>



    <!-- =========================
         TV SHOW GRID
         ========================= -->

    <div
      id="tv-library"
      class="movie-grid"
    ></div>


  </main>



  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script src="/app.js"></script>


  <script>

    const library = document.querySelector(
      "#tv-library"
    );


    if (
      library &&
      typeof shows !== "undefined"
    ) {

      library.innerHTML = shows
        .map(show => showCard(show))
        .join("");

    }

  </script>


</body>

</html>
