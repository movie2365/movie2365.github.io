<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie2365 — Watch Movies</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body data-page="home">

  <!-- =========================
       HEADER
       ========================= -->

  <header class="site-header">

    <a class="brand" href="index.html">
     <img
       src="assets/movie2365-logo.png"
       alt="Movie2365 logo"
       style="width: 30px !important; height: 30px !important; object-fit: contain; flex: 0 0 30px;"
     >
      <span>Movie2365</span>
    </a>

    <nav>

      <a class="active" href="index.html">
        ⌂ Home
      </a>

      <a href="search.html">
        ▦ Browse
      </a>

      <a href="search.html?random=1">
        ⊠ Random
      </a>

      <a
        class="search-icon"
        href="search.html"
        aria-label="Search"
      >
        ⌕
      </a>

    </nav>

  </header>


  <!-- =========================
       MAIN CONTENT
       ========================= -->

  <main>

    <!-- HERO / SEARCH SECTION -->

    <section class="hero">

      <h1>
        Cineby - Watch Online Movies &amp; TV Shows
      </h1>

      <p>
        Thousands of movies and TV shows, updated daily. Just press play.
      </p>


      <!-- SEARCH -->

      <form
        class="search-bar"
        action="search.html"
      >

        <span class="search-symbol">
          ⌕
        </span>

        <input
          name="q"
          type="search"
          placeholder="Search for movies or TV shows..."
          autocomplete="off"
        >

        <button type="submit">
          Search <span>›</span>
        </button>

      </form>


      <!-- QUICK LINKS -->

      <div class="browse-label">
        Start browsing:
      </div>

      <div class="quick-links">

        <a
          class="quick active"
          href="index.html"
        >
          ⌂ <span>Home</span>
        </a>

        <a
          class="quick"
          href="search.html"
        >
          ▦ <span>Movies</span>
        </a>

      </div>

    </section>


    <!-- =========================
         HOT RIGHT NOW
         ========================= -->

    <section class="trending">

      <h2>
        🔥 Hot Right Now
      </h2>

      <!--
        JavaScript will automatically
        generate the movie list here.
      -->

      <div
        id="hot-list"
        class="hot-list"
      ></div>


      <a
        class="trending-link"
        href="search.html"
      >
        See what's trending →
      </a>

    </section>

  </main>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script src="app.js"></script>

</body>
</html>
