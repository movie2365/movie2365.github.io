<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/assets/movie2365-logo.png" type="image/png">

  <title>Movie2365 — Watch Movies</title>

  <link rel="stylesheet" href="/styles.css">
</head>

<body data-page="home">

  <!-- =========================
       HEADER
       ========================= -->

  <header class="site-header">

    <a class="brand" href="https://movie2365.github.io">
     <img
       src="assets/movie2365-logo.png"
       alt="Movie2365 logo"
       style="width: 30px !important; height: 36px !important; object-fit: contain; flex: 0 0 36px;"
     >
      <span>Movie2365</span>
    </a>

    <nav>
<nav>

  <!-- Home -->
  <a
    href="https://movie2365.github.io"
    class="nav-link active"
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>

    <span class="nav-text">Home</span>

  </a>


  <!-- Browse Dropdown -->
  <details class="nav-dropdown">

    <summary
      class="nav-dropdown-toggle"
      aria-label="Browse content categories"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>

      <span class="nav-text">Browse</span>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>

    </summary>


    <div class="nav-dropdown-menu">

      <a
        href="/library/movies/index.html"
        class="nav-dropdown-item"
      >
        🎬 Movies
      </a>

      <a
        href="/library/tv-shows/index.html"
        class="nav-dropdown-item"
      >
        📺 TV Shows
      </a>

    </div>

  </details>


  <!-- Random -->
  <a
    href="search.html?random=1"
    id="randomNavLink"
    class="nav-link"
    rel="nofollow"
    title="Pick a random movie or TV show"
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <circle cx="15.5" cy="8.5" r="1.5"></circle>
      <circle cx="15.5" cy="15.5" r="1.5"></circle>
      <circle cx="8.5" cy="15.5" r="1.5"></circle>
      <circle cx="12" cy="12" r="1.5"></circle>
    </svg>

    <span class="nav-text">Random</span>

  </a>


  <!-- Search -->
  <a
    class="search-icon"
    href="/search"
    aria-label="Search"
    title="Search"
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>

  </a>

</nav>

  </header>


  <!-- =========================
       MAIN CONTENT
       ========================= -->

  <main>

    <!-- HERO / SEARCH SECTION -->

    <section class="hero">

      <h1>
        Movie2365 - Watch Online Movies &amp; TV Shows
      </h1>

      <p>
        Thousands of movies and TV shows, updated daily. Just press play.
      </p>


      <!-- SEARCH -->

      <form
        class="search-bar"
        action="/search/search.html"
      >

        <span class="search-symbol">
          ⌕
        </span>

        <input
          name="q"
          type="search"
          placeholder="Search for movies or TV shows..."
          autocomplete="off"
        >

        <button type="submit">
          Search <span>›</span>
        </button>

      </form>


      <!-- QUICK LINKS -->

      <div class="browse-label">
        Start browsing:
      </div>

      <div class="quick-links">

        <a
          class="quick"
          href="/library/movies"
        >
          🎬 <span>Movies</span>
        </a>

        <a
          class="quick"
          href="/library/tv-shows"
        >
          📺 <span>TV Shows</span>
        </a>

      </div>

    </section>


    <!-- =========================
         HOT RIGHT NOW
         ========================= -->

    <section class="trending">

      <h2>
        🔥 Hot Right Now
      </h2>

      <!--
        JavaScript will automatically
        generate the movie list here.
      -->

      <div
        id="hot-list"
        class="hot-list"
      ></div>


      <a
        class="trending-link"
        href="search.html"
      >
        See what's trending →
      </a>

    </section>

  </main>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script src="app.js"></script>

</body>
</html>
