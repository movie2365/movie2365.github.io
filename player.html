<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="icon" href="assets/movie2365-logo.png" type="image/png">

  <title>Movie2365 - Watch</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body data-page="player">


  <!-- =========================
       HEADER
       ========================= -->

  <header class="site-header">

    <a
      class="brand"
      href="https://brady2365.github.io"
    >

     <img
       src="assets/movie2365-logo.png"
       alt="Movie2365 logo"
       style="width: 30px !important; height: 30px !important; object-fit: contain; flex: 0 0 30px;"
     >

      <span>
        Movie2365
      </span>

    </a>


<nav>

  <!-- Home -->
  <a
    href="https://movie2365.github.io"
    class="nav-link active"
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>

    <span class="nav-text">Home</span>

  </a>


  <!-- Browse Dropdown -->
  <details class="nav-dropdown">

    <summary
      class="nav-dropdown-toggle"
      aria-label="Browse content categories"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>

      <span class="nav-text">Browse</span>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>

    </summary>


    <div class="nav-dropdown-menu">

      <a
        href="/library/movies/index.html"
        class="nav-dropdown-item"
      >
        🎬 Movies
      </a>

      <a
        href="/library/tv-shows/index.html"
        class="nav-dropdown-item"
      >
        📺 TV Shows
      </a>

    </div>

  </details>


  <!-- Random -->
  <a
    href="search.html?random=1"
    id="randomNavLink"
    class="nav-link"
    rel="nofollow"
    title="Pick a random movie or TV show"
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <circle cx="15.5" cy="8.5" r="1.5"></circle>
      <circle cx="15.5" cy="15.5" r="1.5"></circle>
      <circle cx="8.5" cy="15.5" r="1.5"></circle>
      <circle cx="12" cy="12" r="1.5"></circle>
    </svg>

    <span class="nav-text">Random</span>

  </a>


  <!-- Search -->
  <a
    class="search-icon"
    href="/search"
    aria-label="Search"
    title="Search"
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>

  </a>

</nav>

  </header>



  <!-- =========================
       WATCH PAGE
       ========================= -->

  <main class="watch-page">


    <!-- =========================
         VIDEO PLAYER
         ========================= -->

    <div class="player-wrap">


      <!--
        JavaScript creates all of the
        server iframes here.

        Every server gets its own iframe.
      -->

      <div
        id="player-stack"
        class="player-stack"
      ></div>


      <!--
        This appears when the selected
        server doesn't have an iframe
        source yet.
      -->

      <div
        id="player-fallback"
        class="player-fallback"
      >

        <span class="fallback-play">
          ▶
        </span>

        <p>
          Add an iframe
          <code>src</code>
          in
          <code>app.js</code>
          to start the player.
        </p>

      </div>


    </div>



    <!-- =========================
         SERVER NOTICE
         ========================= -->

    <div class="server-notice">

      ◉ Server not working?
      Switch to another one.

    </div>



    <!-- =========================
         SERVER BUTTONS
         ========================= -->

    <!--

      JavaScript automatically creates
      all 18 server buttons here.

      Servers:

      Lumen
      Helix
      Quasar
      Comet
      Pulsar
      Theta
      Spark
      Haze
      Nyx
      Gale
      Nova
      Nebula
      Blaze
      Forge
      Wisp
      Raze
      Flare
      Beam

    -->

    <div
      id="server-buttons"
      class="server-buttons"
    ></div>



    <!-- =========================
         MOVIE INFORMATION
         ========================= -->

    <section
      id="movie-info"
      class="movie-info"
    ></section>


  </main>



  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script src="app.js"></script>


</body>

</html>
