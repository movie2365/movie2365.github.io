<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request - Movie2365</title>

    <style>
        :root {
            --bg: #000000;
            --panel: #151515;
            --border: #2c2c2c;
            --text: #f4f4f4;
            --muted: #8f8f8f;
            --red: #ed111c;
            --red-dark: #a4070d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        .site-header {
            height: 64px;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 2px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 13px;

            font-size: 29px;

            letter-spacing: -1px;
        }

        .brand-mark {
            width: 37px;
            height: 37px;

            display: grid;
            place-items: center;

            border-radius: 12px;
            background: var(--red);

            color: white;
            font-size: 18px;
            font-weight: 900;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 26px;

            color: #a8a8a8;
            font-size: 14px;
            font-weight: 650;
        }

        nav a {
            transition: color 0.2s ease;
        }

        nav a:hover,
        nav a.active {
            color: white;
        }

        /* =========================
           PAGE
        ========================= */

        .request-page {
            min-height: calc(100vh - 64px);

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 70px 20px 100px;

            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(110, 0, 8, 0.34),
                    transparent 55%
                ),
                linear-gradient(
                    #070000,

                );

        .request-container {

        }

            margin: 0;

        .request-form {

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.45);

            margin-bottom: 22px;

        .form-group:last-of-type {
            margin-bottom: 25px;

        label {
            display: block;

            margin-bottom: 9px;

            color: #d7d7d7;
            font-size: 13px;

        }

        input,
        select {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            color: white;

            font-size: 14px;

            transition:

        input::placeholder {
            color: #686868;
        }

        input:focus,
        select:focus {
            border-color: var(--red);
            background: #111111;
        }

        select {
            cursor: pointer;
        }

        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-button {
            width: 100%;
            height: 50px;

            border: 0;
            border-radius: 9px;

            background: var(--red);
            color: white;

            font-family: inherit;
            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .submit-button:hover {
            background: #ff1d29;
            transform: translateY(-1px);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           MESSAGE
        ========================= */

        .form-message {
            display: none;

            margin-top: 15px;
            padding: 12px;

            border-radius: 8px;

            text-align: center;
            font-size: 13px;
        }

        .form-message.success {
            display: block;

            color: #8cff9a;

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .site-header {
                height: 58px;
                padding: 0 15px;

            .brand {
                font-size: 23px;

                font-size: 13px;

            }

            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <a href="index.html" class="brand">
            <span class="brand-mark">▶</span>
            Movie2365
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="tv.html">TV Shows</a>
            <a href="request.html" class="active">Request</a>
        </nav>

    </header>


    <!-- REQUEST PAGE -->

    <main class="request-page">

        <div class="request-container">

            <h1 class="request-title">
                Request a Movie or Show
            </h1>

            <p class="request-subtitle">
                Tell us what you'd like to see added.
            </p>


            <form
                id="requestForm"
                class="request-form"
                action="YOUR_FORM_ENDPOINT_HERE"
                method="POST"
            >

                <!-- MOVIE / SHOW NAME -->

                <div class="form-group">

                    <label for="title">
                        What movie/show do you want me to add?
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter a movie or show"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- TYPE -->

                <div class="form-group">

                    <label for="type">
                        Type
                    </label>

                    <select
                        id="type"
                        name="type"
                        required
                    >

                        <option value="Movie">
                            Movie
                        </option>

                        <option value="TV Show">
                            TV Show
                        </option>

                    </select>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton"
                >
                    Submit Request
                </button>

                <div
                    id="formMessage"
                    class="form-message"
                ></div>

            </form>

        </div>

    </main>


    <script>

        const form = document.getElementById("requestForm");
        const submitButton = document.getElementById("submitButton");
        const formMessage = document.getElementById("formMessage");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            submitButton.disabled = true;
            submitButton.textContent = "Submitting...";

            formMessage.className = "form-message";
            formMessage.textContent = "";

            try {

                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (response.ok) {

                    form.reset();

                    formMessage.className =
                        "form-message success";

                    formMessage.textContent =
                        "Request submitted successfully!";

                } else {

                    throw new Error("Submission failed");

                }

            } catch (error) {

                formMessage.className =
                    "form-message error";

                formMessage.textContent =
                    "Something went wrong. Please try again.";

            }

            submitButton.disabled = false;
            submitButton.textContent = "Submit Request";

        });

    </script>

</body>
</html>
